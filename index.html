<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHRONOS 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.6.0/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Courier New', 'monospace']
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        @keyframes numberFlip {
            0% { transform: translateY(-16px) scale(0.92); opacity: 0; filter: blur(8px); }
            100% { transform: translateY(0) scale(1); opacity: 1; filter: blur(0); }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }
        .number-change {
            animation: numberFlip 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .fixed-digit-box {
            display: inline-block;
            font-variant-numeric: tabular-nums;
            text-align: center;
        }
        .shimmer-text {
            background: linear-gradient(90deg, #6366f1 0%, #a855f7 25%, #ec4899 50%, #a855f7 75%, #6366f1 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            animation: shimmer 5s linear infinite;
        }
        .floating-container {
            animation: floatSlow 6s ease-in-out infinite;
        }
        body {
            background-color: #030712;
            color: #f9fafb;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            margin: 0;
            user-select: none;
        }
        #webgl-container {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative overflow-hidden">

    <div id="webgl-container"></div>

    <main class="z-10 flex flex-col items-center justify-center px-4 w-full max-w-7xl floating-container">
        
        <!-- Main Countdown Grid (Months, Days, Hours, Minutes) -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 sm:gap-6 w-full max-w-5xl mb-8">
            
            <!-- Months -->
            <div class="glass-panel rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center relative group transition-all duration-500 hover:border-indigo-500/50">
                <div class="absolute inset-0 bg-gradient-to-b from-indigo-500/10 to-transparent rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                <div class="text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-tight mb-2">
                    <span id="months-val" class="fixed-digit-box">00</span>
                </div>
                <div class="text-xs sm:text-sm uppercase tracking-[0.3em] text-indigo-400 font-extrabold">Bulan</div>
            </div>

            <!-- Days -->
            <div class="glass-panel rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center relative group transition-all duration-500 hover:border-purple-500/50">
                <div class="absolute inset-0 bg-gradient-to-b from-purple-500/10 to-transparent rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                <div class="text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-tight mb-2">
                    <span id="days-val" class="fixed-digit-box w-32">000</span>
                </div>
                <div class="text-xs sm:text-sm uppercase tracking-[0.3em] text-purple-400 font-extrabold">Hari</div>
            </div>

            <!-- Hours -->
            <div class="glass-panel rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center relative group transition-all duration-500 hover:border-pink-500/50">
                <div class="absolute inset-0 bg-gradient-to-b from-pink-500/10 to-transparent rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                <div class="text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-tight mb-2">
                    <span id="hours-val" class="fixed-digit-box">00</span>
                </div>
                <div class="text-xs sm:text-sm uppercase tracking-[0.3em] text-pink-400 font-extrabold">Jam</div>
            </div>

            <!-- Minutes -->
            <div class="glass-panel rounded-3xl p-6 sm:p-10 flex flex-col items-center justify-center relative group transition-all duration-500 hover:border-cyan-500/50">
                <div class="absolute inset-0 bg-gradient-to-b from-cyan-500/10 to-transparent rounded-3xl opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                <div class="text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-tight mb-2">
                    <span id="minutes-val" class="fixed-digit-box">00</span>
                </div>
                <div class="text-xs sm:text-sm uppercase tracking-[0.3em] text-cyan-400 font-extrabold">Menit</div>
            </div>

        </div>

        <!-- Seconds & Milliseconds Bar -->
        <div class="glass-panel w-full max-w-3xl rounded-2xl px-8 py-5 flex items-center justify-center space-x-4 shadow-2xl">
            <div class="font-mono text-3xl sm:text-5xl font-black tracking-wider flex items-center">
                <span id="seconds-val" class="fixed-digit-box w-16 text-pink-400">00</span>
                <span class="text-slate-600 mx-2 animate-pulse">:</span>
                <span id="milliseconds-val" class="fixed-digit-box w-28 text-indigo-400 text-2xl sm:text-4xl">000</span>
            </div>
        </div>

    </main>

    <script>
        // Target: 18 October 2026, 08:00:00 AM WIB
        const targetDate = new Date('2026-10-18T08:00:00').getTime();

        const prevValues = {
            months: '',
            days: '',
            hours: '',
            minutes: '',
            seconds: ''
        };

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('months-val').innerText = '00';
                document.getElementById('days-val').innerText = '000';
                document.getElementById('hours-val').innerText = '00';
                document.getElementById('minutes-val').innerText = '00';
                document.getElementById('seconds-val').innerText = '00';
                document.getElementById('milliseconds-val').innerText = '000';
                return;
            }

            const nowObj = new Date();
            let months = (2026 - nowObj.getFullYear()) * 12 + (9 - nowObj.getMonth());
            
            let tempDate = new Date(nowObj.getTime());
            tempDate.setMonth(tempDate.getMonth() + months);
            if (tempDate.getTime() > targetDate) {
                months--;
                tempDate = new Date(nowObj.getTime());
                tempDate.setMonth(tempDate.getMonth() + months);
            }

            const diffAfterMonths = targetDate - tempDate.getTime();
            
            const days = Math.floor(diffAfterMonths / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffAfterMonths % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diffAfterMonths % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffAfterMonths % (1000 * 60)) / 1000);
            const milliseconds = Math.floor(diffAfterMonths % 1000);

            const fMonths = String(Math.max(0, months)).padStart(2, '0');
            const fDays = String(Math.max(0, days)).padStart(3, '0');
            const fHours = String(Math.max(0, hours)).padStart(2, '0');
            const fMinutes = String(Math.max(0, minutes)).padStart(2, '0');
            const fSeconds = String(Math.max(0, seconds)).padStart(2, '0');
            const fMilliseconds = String(Math.max(0, milliseconds)).padStart(3, '0');

            updateDOMElement('months-val', fMonths, 'months');
            updateDOMElement('days-val', fDays, 'days');
            updateDOMElement('hours-val', fHours, 'hours');
            updateDOMElement('minutes-val', fMinutes, 'minutes');
            updateDOMElement('seconds-val', fSeconds, 'seconds');
            
            document.getElementById('milliseconds-val').innerText = fMilliseconds;
        }

        function updateDOMElement(id, newVal, key) {
            const el = document.getElementById(id);
            if (prevValues[key] !== newVal) {
                el.innerText = newVal;
                el.classList.remove('number-change');
                void el.offsetWidth;
                el.classList.add('number-change');
                prevValues[key] = newVal;
            }
        }

        // Three.js 3D Background Setup
        let scene, camera, renderer, crystalGroup, particlesMesh;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;

        function initThree() {
            const container = document.getElementById('webgl-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030712, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x030712);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const pointLight1 = new THREE.PointLight(0x6366f1, 3, 50);
            pointLight1.position.set(15, 15, 15);
            scene.add(pointLight1);

            const pointLight2 = new THREE.PointLight(0xec4899, 3, 50);
            pointLight2.position.set(-15, -15, 15);
            scene.add(pointLight2);

            // Floating Geometric Crystals
            crystalGroup = new THREE.Group();
            const geometries = [
                new THREE.IcosahedronGeometry(2, 0),
                new THREE.OctahedronGeometry(2.2, 0),
                new THREE.TetrahedronGeometry(2.5, 0),
                new THREE.DodecahedronGeometry(1.8, 0)
            ];

            const materials = [
                new THREE.MeshPhysicalMaterial({ color: 0x6366f1, roughness: 0.1, metalness: 0.8, transmission: 0.6, transparent: true, opacity: 0.8 }),
                new THREE.MeshPhysicalMaterial({ color: 0xa855f7, roughness: 0.2, metalness: 0.7, transmission: 0.5, transparent: true, opacity: 0.8 }),
                new THREE.MeshPhysicalMaterial({ color: 0xec4899, roughness: 0.15, metalness: 0.9, transmission: 0.7, transparent: true, opacity: 0.8 }),
                new THREE.MeshPhysicalMaterial({ color: 0x06b6d4, roughness: 0.1, metalness: 0.8, transmission: 0.6, transparent: true, opacity: 0.8 })
            ];

            for (let i = 0; i < 25; i++) {
                const geom = geometries[Math.floor(Math.random() * geometries.length)];
                const mat = materials[Math.floor(Math.random() * materials.length)];
                const mesh = new THREE.Mesh(geom, mat);

                mesh.position.set(
                    (Math.random() - 0.5) * 50,
                    (Math.random() - 0.5) * 30,
                    (Math.random() - 0.5) * 30 - 5
                );

                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
                
                mesh.userData = {
                    rotSpeedX: (Math.random() - 0.5) * 0.01,
                    rotSpeedY: (Math.random() - 0.5) * 0.01,
                    floatSpeed: Math.random() * 0.02 + 0.01,
                    floatOffset: Math.random() * Math.PI * 2
                };

                crystalGroup.add(mesh);
            }
            scene.add(crystalGroup);

            // Particle Dust Field
            const particlesCount = 700;
            const posArray = new Float32Array(particlesCount * 3);

            for (let i = 0; i < particlesCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 80;
            }

            const particlesGeometry = new THREE.BufferGeometry();
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));

            const particlesMaterial = new THREE.PointsMaterial({
                size: 0.12,
                color: 0x818cf8,
                transparent: true,
                opacity: 0.7,
                blending: THREE.AdditiveBlending
            });

            particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particlesMesh);

            // Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
        }

        function onMouseMove(event) {
            mouseX = (event.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animateThree() {
            requestAnimationFrame(animateThree);

            targetX = mouseX * 2;
            targetY = mouseY * 2;

            camera.position.x += (targetX - camera.position.x) * 0.05;
            camera.position.y += (targetY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            const elapsedTime = Date.now() * 0.001;

            crystalGroup.children.forEach((mesh) => {
                mesh.rotation.x += mesh.userData.rotSpeedX;
                mesh.rotation.y += mesh.userData.rotSpeedY;
                mesh.position.y += Math.sin(elapsedTime * mesh.userData.floatSpeed + mesh.userData.floatOffset) * 0.015;
            });

            particlesMesh.rotation.y = elapsedTime * 0.03;

            renderer.render(scene, camera);
        }

        // Initialize everything on load
        window.onload = function() {
            initThree();
            animateThree();
            updateCountdown();
            setInterval(updateCountdown, 33); // ~30 FPS high precision countdown update
        }
    </script>
</body>
</html>
